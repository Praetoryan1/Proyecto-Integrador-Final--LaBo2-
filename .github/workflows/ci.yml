name: Verificación
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: trazo_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"
      - run: dotnet restore --locked-mode Trazo.sln
      - run: dotnet build Trazo.sln --no-restore
      - run: dotnet test Trazo.sln --no-build --logger 'trx;LogFileName=pruebas.trx'
        env:
          TRAZO_TEST_CONNECTION: "Server=127.0.0.1;Port=3306;Database=trazo_tests;User ID=root;Password=ci-only-password;SslMode=Disabled;AllowPublicKeyRetrieval=True"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: "**/TestResults/*.trx"
