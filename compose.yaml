name: trazo
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: trazo_dev
      MYSQL_USER: trazo
      MYSQL_PASSWORD: ${TRAZO_DB_PASSWORD:?Ejecutar tools/Preparar-Entorno.ps1}
      MYSQL_ROOT_PASSWORD: ${TRAZO_ROOT_PASSWORD:?Ejecutar tools/Preparar-Entorno.ps1}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -h127.0.0.1 -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  mysql_data:
