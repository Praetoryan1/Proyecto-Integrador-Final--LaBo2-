# Instancia académica aislada: no usa trazo_dev ni su volumen.
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${TRAZO_ENTREGA_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: trazo_entrega
      MYSQL_USER: trazo
      MYSQL_PASSWORD: ${TRAZO_ENTREGA_PASSWORD:?Ejecutar tools/Preparar-Entrega.ps1}
      MYSQL_ROOT_PASSWORD: ${TRAZO_ENTREGA_ROOT_PASSWORD:?Ejecutar tools/Preparar-Entrega.ps1}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -h127.0.0.1 -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
